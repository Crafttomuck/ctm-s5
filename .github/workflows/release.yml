name: Build & Release

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - id: pack
        name: Read pack.toml
        run: |
          ver=$(grep -E '^version\s*=' pack/pack.toml | sed -E 's/^version\s*=\s*"([^"]+)".*/\1/')
          neoforge=$(grep -E '^neoforge\s*=' pack/pack.toml | sed -E 's/^neoforge\s*=\s*"([^"]+)".*/\1/')
          base="${{ github.event.repository.name }}"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "neoforge=$neoforge" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "client_zip=${base}-client-${ver}.zip" >> "$GITHUB_OUTPUT"
          echo "server_zip=${base}-server-${ver}.zip" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Install moddl
        run: install -m 0755 .github/moddl /usr/local/bin/moddl

      - name: Build client zip
        working-directory: pack
        run: packwiz curseforge export -s client -o "../${{ steps.pack.outputs.client_zip }}"

      - name: Patch client manifest (packwiz NeoForge bug workaround)
        if: steps.pack.outputs.neoforge != ''
        run: |
          zip="${{ steps.pack.outputs.client_zip }}"
          nf="neoforge-${{ steps.pack.outputs.neoforge }}"
          tmpdir=$(mktemp -d)
          unzip -q "$zip" manifest.json -d "$tmpdir"
          jq --arg nf "$nf" '.minecraft.modLoaders = [{"id": $nf, "primary": true}]' \
            "$tmpdir/manifest.json" > "$tmpdir/manifest.patched.json"
          mv "$tmpdir/manifest.patched.json" "$tmpdir/manifest.json"
          (cd "$tmpdir" && zip -qr "$GITHUB_WORKSPACE/$zip" manifest.json)
          rm -rf "$tmpdir"

      - name: Build server zip
        if: env.CURSEFORGE_API_KEY != ''
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          (cd pack && packwiz curseforge export -s server -o /tmp/server-cf.zip)
          mkdir -p /tmp/server-cf-extracted
          unzip -q /tmp/server-cf.zip -d /tmp/server-cf-extracted

          mkdir -p server-build/mods
          moddl /tmp/server-cf-extracted/manifest.json server-build/mods

          if [ -d /tmp/server-cf-extracted/overrides ]; then
            cp -a /tmp/server-cf-extracted/overrides/. server-build/
          fi

          (cd server-build && zip -qr "../${{ steps.pack.outputs.server_zip }}" .)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.base }}-${{ steps.pack.outputs.version }}-${{ github.sha }}
          path: |
            ${{ steps.pack.outputs.client_zip }}
            ${{ steps.pack.outputs.server_zip }}
          if-no-files-found: ignore

      - name: Extract release notes from changelog
        id: notes
        run: |
          ver="${{ steps.pack.outputs.version }}"
          awk -v hdr="## $ver" '
            $0 == hdr { f = 1; next }
            /^## / && f { exit }
            f { print }
          ' pack/changelog.md > RELEASE_NOTES.md
          if grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No changelog section found for $ver; falling back to auto-generated notes."
          fi

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.pack.outputs.version }}"
          client="${{ steps.pack.outputs.client_zip }}"
          server="${{ steps.pack.outputs.server_zip }}"

          assets=("$client")
          if [ -f "$server" ]; then
            assets+=("$server")
          fi

          if [ "${{ steps.notes.outputs.has_notes }}" = "true" ]; then
            notes_args=(--notes-file RELEASE_NOTES.md)
          else
            notes_args=(--generate-notes)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            if [ "${{ steps.notes.outputs.has_notes }}" = "true" ]; then
              gh release edit "$tag" --notes-file RELEASE_NOTES.md
            fi
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              "${notes_args[@]}" \
              --title "$tag"
          fi

      # Uploads the client zip to CurseForge. Runs only when the project ID
      # variable is configured (Settings > Secrets and variables > Actions):
      #   - variable CURSEFORGE_PROJECT_ID = the modpack's CurseForge project ID
      #   - secret   CURSEFORGE_TOKEN      = a CurseForge API upload token
      - name: Publish client to CurseForge
        if: ${{ vars.CURSEFORGE_PROJECT_ID != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ steps.pack.outputs.client_zip }}
          name: "v${{ steps.pack.outputs.version }}"
          version: "${{ steps.pack.outputs.version }}"
          version-type: release
          game-versions: "1.21.1"
          loaders: neoforge
          changelog-file: RELEASE_NOTES.md
